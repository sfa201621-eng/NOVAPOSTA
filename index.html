header{

}

.logo{
    font-size:25px;

}

.container{

.grid{

}

}

}

button{
    border:0;
    padding:13px 17px;

}

    color:white;

    margin-top:20px;
}

.scan{

    margin-top:10px;
}

.result{

}

.search{
    display:flex;
    gap:8px;
}

.search input{
    margin:0;
}

.search button{
    background:#111;
    color:white;
}

    border-bottom:2px solid #111;
}

    padding:13px;

}

    font-size:17px;
    margin-top:5px;
}
